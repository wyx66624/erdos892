name: Lean

on:
  push:
    branches: ["main", "research/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          axiom-audit: true
          axiom-audit-root: Erdos892
