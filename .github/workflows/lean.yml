name: Lean

on:
  push:
    branches: ["main", "research/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          if grep -R -n -E '\b(sorry|admit|axiom)\b' --include='*.lean' Erdos892.lean Erdos892; then
            echo 'Lean placeholders or project-defined axioms are forbidden.' >&2
            exit 1
          fi
